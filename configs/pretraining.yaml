protscape_no_uniformity:
  module: pretraining.train_protscape
  args: >-
    --gnn-dropout 0.4 --cell-pooling attention --s2gae-enabled 1 --graph-saint-norm 0
    --dataset-mode bulk --epochs 300 --checkpointing true --k-negatives 1
    --use-metagraph true --loader graphsaint --split-mode global --lr 0.01
    --batch-size 64 --weighted-ppi-loss false --ppi-loss bce
    --s2gae-mask-ratio 0.5 --s2gae-mask-type um
    --s2gae-decoder-type cross_layer --s2gae-decoder-dropout 0
    --s2gae-loss-weight 1 --metagraph-loss-weight 1
    --uniformity-enabled false

protscape_phuber:
  module: pretraining.train_protscape
  args: >-
    --gnn-dropout 0.4 --cell-pooling attention --s2gae-enabled 1 --graph-saint-norm 0
    --dataset-mode bulk --epochs 300 --checkpointing true --k-negatives 1
    --use-metagraph true --split-mode global --lr 0.01 --batch-size 64
    --ppi-loss phuber --ppi-phuber-tau 10 --s2gae-mask-ratio 0.5
    --s2gae-mask-type um --uniformity-enabled true
    --uniformity-lambda-reg 0.00005 --uniformity-t 2 --uniformity-dim 0

protscape_l1:
  module: pretraining.train_protscape
  args: >-
    --gnn-dropout 0 --cell-pooling attention --s2gae-enabled 1 --graph-saint-norm 0
    --dataset-mode bulk --epochs 300 --checkpointing true --k-negatives 1
    --use-metagraph true --split-mode global --lr 0.01 --batch-size 64
    --ppi-loss l1 --s2gae-mask-ratio 0.5 --s2gae-mask-type um
    --uniformity-enabled true --uniformity-lambda-reg 0.00005
    --uniformity-t 2 --uniformity-dim 0

pinnacle_random:
  module: pretraining.train_pinnacle
  args: --gnn-method GATv2 --gnn-lambda 0.01 --gnn-dropout 0.2 --gnn-output 32 --features-mode random --dataset-mode bulk --epochs 150

pinnacle_esm_gat:
  module: pretraining.train_pinnacle
  args: --gnn-method GATv2 --gnn-lambda 0.01 --gnn-dropout 0.2 --gnn-output 32 --features-mode ESM2 --dataset-mode bulk --epochs 150

pinnacle_esm_acm:
  module: pretraining.train_pinnacle
  args: --gnn-method ACM_RandomWalk --gnn-lambda 0.01 --gnn-dropout 0.2 --gnn-output 64 --features-mode ESM2 --dataset-mode bulk --epochs 150
