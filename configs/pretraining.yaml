protscape:
  module: pretraining.train_protscape
  args: >-
    ACM_RandomWalk concat 512 0.4 3 1 attention ESM2 0 1 512 2 0
    --dataset-mode bulk --epochs 300 --checkpointing true --k-negatives 1
    --use-metagraph true --loader graphsaint --split-mode global --lr 0.01
    --batch-size 64 --weighted-ppi-loss false --ppi-loss bce
    --s2gae-mask-ratio 0.5 --s2gae-mask-type dm
    --s2gae-decoder-type cross_layer --s2gae-decoder-dropout 0
    --s2gae-loss-weight 1 --metagraph-loss-weight 1
    --uniformity-enabled true --uniformity-lambda-reg 0.00005
    --uniformity-t 2 --uniformity-dim 0

protscape_gae:
  module: pretraining.train_protscape
  args: >-
    ACM_RandomWalk concat 512 0.6 3 1 attention ESM2 0 0 512 2 0
    --dataset-mode bulk --epochs 300 --checkpointing true --k-negatives 1
    --use-metagraph true --loader graphsaint --split-mode global --lr 0.01
    --batch-size 64 --weighted-ppi-loss false --ppi-loss bce
    --metagraph-loss-weight 1 --uniformity-enabled false

protscape_phuber:
  module: pretraining.train_protscape
  args: >-
    ACM_RandomWalk concat 512 0.4 3 1 attention ESM2 0 1 512 2 0
    --dataset-mode bulk --epochs 300 --checkpointing true --k-negatives 1
    --use-metagraph true --split-mode global --lr 0.01 --batch-size 64
    --ppi-loss phuber --ppi-phuber-tau 10 --s2gae-mask-ratio 0.5
    --s2gae-mask-type dm --uniformity-enabled true
    --uniformity-lambda-reg 0.00005 --uniformity-t 2 --uniformity-dim 0

protscape_l1:
  module: pretraining.train_protscape
  args: >-
    ACM_RandomWalk concat 512 0 3 1 attention ESM2 0 1 512 2 0
    --dataset-mode bulk --epochs 300 --checkpointing true --k-negatives 1
    --use-metagraph true --split-mode global --lr 0.01 --batch-size 64
    --ppi-loss l1 --s2gae-mask-ratio 0.5 --s2gae-mask-type dm
    --uniformity-enabled true --uniformity-lambda-reg 0.00005
    --uniformity-t 2 --uniformity-dim 0

pinnacle_random:
  module: pretraining.train_pinnacle
  args: GATv2 0.01 0.2 32 random --dataset-mode bulk --epochs 150

pinnacle_esm_gat:
  module: pretraining.train_pinnacle
  args: GATv2 0.01 0.2 32 ESM2 --dataset-mode bulk --epochs 150

pinnacle_esm_acm:
  module: pretraining.train_pinnacle
  args: ACM_RandomWalk 0.01 0.2 64 ESM2 --dataset-mode bulk --epochs 150
